name: PHP Syntax Check

on:
  push:
    branches: [ "main", "feat/ceirgo-dhru-qris-rework" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, json, simplexml
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "Syntax error: $file"
              failed=1
            fi
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          exit "$failed"
